# Production overlay — TLS via Caddy, no public web/Postgres ports.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# billing-cron + db-backup live in docker-compose.yml (Coolify uses the base file).

services:
  postgres:
    ports: []

  web:
    ports: []
    environment:
      # Set BETTER_AUTH_URL / NEXT_PUBLIC_APP_URL in .env to https://$APP_DOMAIN
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
