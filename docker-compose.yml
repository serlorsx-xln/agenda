services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Postgres is internal to the compose network only (no host port).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile.migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}

  worker-line:
    build:
      context: .
      dockerfile: services/worker-line/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      WORKER_PORT: ${WORKER_PORT:-4000}
      LINE_DEVICE: ${LINE_DEVICE:-ANDROIDSECONDARY}
      LINE_SESSION_PATH: /data/session/session.json
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-30}
      MAX_HOT_SESSIONS: ${MAX_HOT_SESSIONS:-200}
      MAX_BOOT_RESTORE_SESSIONS: ${MAX_BOOT_RESTORE_SESSIONS:-1}
      SESSION_IDLE_EVICT_MS: ${SESSION_IDLE_EVICT_MS:-300000}
      AUTO_REPLY_CYCLE_SEC: ${AUTO_REPLY_CYCLE_SEC:-30}
      AUTO_REPLY_TICK_MS: ${AUTO_REPLY_TICK_MS:-100}
      HIBERNATE_AFTER_AUTO_REPLY_POLL: ${HIBERNATE_AFTER_AUTO_REPLY_POLL:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: production
    volumes:
      - worker_session:/data/session
    # Dev/small profile — see docs/CAPACITY.md (8g+ worker RAM for large cold pools)
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:${WORKER_PORT:-4000}/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    # Stay on Coolify's proxy network so Traefik can reach web after every
    # redeploy without manually reconnecting coolify-proxy.
    networks:
      - default
      - coolify
    labels:
      # Tell Traefik which network to use when the container has multiple nets.
      - traefik.docker.network=coolify
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      worker-line:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      WORKER_LINE_URL: ${WORKER_LINE_URL:-http://worker-line:4000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PROMPTPAY_ID: ${PROMPTPAY_ID}
      SLIP_RECEIVER_ACCOUNT: ${SLIP_RECEIVER_ACCOUNT:-}
      SCB_SLIP_URL: ${SCB_SLIP_URL}
      SCB_API_KEY: ${SCB_API_KEY}
      SCB_PROJECT: ${SCB_PROJECT}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET}
      BILLING_OPS_TOKEN: ${BILLING_OPS_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      CRON_SECRET: ${CRON_SECRET}
      SENTRY_DSN: ${SENTRY_DSN:-}
      PAYMENT_TTL_MINUTES: ${PAYMENT_TTL_MINUTES:-30}
      PAYMENT_GRACE_MINUTES: ${PAYMENT_GRACE_MINUTES:-15}
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-3}
      NODE_ENV: production
    ports:
      - "3000:3000"
    # Next.js standalone — sufficient for typical dashboard traffic
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Daily Postgres dump (Coolify uses this base compose — keep here, not only prod overlay).
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - postgres_backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump -Fc -f /backups/line-$$ts.dump
          find /backups -name 'line-*.dump' -mtime +14 -delete
          sleep 86400
        done

  # Hourly billing + notification maintenance against the web service.
  billing-cron:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET}
      WEB_URL: http://web:3000
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        while true; do
          curl -fsS -X POST -H "x-cron-secret: $$CRON_SECRET" "$$WEB_URL/api/cron/billing" || true
          curl -fsS -X POST -H "x-cron-secret: $$CRON_SECRET" "$$WEB_URL/api/cron/notifications" || true
          sleep 3600
        done

volumes:
  postgres_data:
  worker_session:
  postgres_backups:

# Coolify proxy listens on this external network. Local compose: create once with
# `docker network create coolify` (start.sh does this automatically).
networks:
  coolify:
    name: coolify
    external: true
